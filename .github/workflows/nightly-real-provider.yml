name: Nightly Real Provider E2E

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  real-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build (E2E test mode)
        run: npm run build
        env:
          VITE_BRYANTLABS_E2E: "1"

      - name: Detect provider credentials
        id: provider-credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          available=false
          if [ -n "${GROQ_API_KEY}" ] || [ -n "${ANTHROPIC_API_KEY}" ] || [ -n "${GEMINI_API_KEY}" ] || [ -n "${GOOGLE_API_KEY}" ] || [ -n "${OPENROUTER_API_KEY}" ]; then
            available=true
          fi
          echo "available=${available}" >> "$GITHUB_OUTPUT"

      - name: Real-provider smoke (opt-in)
        if: steps.provider-credentials.outputs.available == 'true'
        run: npm run test:e2e:real
        env:
          CI: "1"
          BRYANTLABS_E2E_REAL_PROVIDER: "1"
          PLAYWRIGHT_USE_DIST: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Skip notice (no API key configured)
        if: steps.provider-credentials.outputs.available == 'false'
        run: echo "Skipping real-provider smoke — add a supported provider API key repo secret."
