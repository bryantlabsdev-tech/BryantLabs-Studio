name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Dependency license policy
        run: npm run licenses:check

      - name: Provenance register coverage
        run: npm run provenance:check && npm run provenance:test

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (renderer)
        run: npm run test:unit

      - name: Brownfield edit stress (dry + mock pipeline + verify)
        run: npm run edit:stress && npm run edit:stress:live && npm run edit:stress:provider:fast

      - name: Unit tests (electron main)
        run: npm run test:electron

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build (E2E test mode)
        run: npm run build
        env:
          VITE_BRYANTLABS_E2E: "1"

      - name: E2E (mock provider)
        run: xvfb-run -a npm run test:e2e
        env:
          CI: "1"
          BRYANTLABS_MOCK_PROVIDER: "1"
          PLAYWRIGHT_USE_DIST: "1"

  windows-package-scripts:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck and policy lockstep
        run: npm run typecheck

      - name: Provenance register coverage
        run: npm run provenance:check

      - name: Provenance tests
        run: node --experimental-strip-types --import ./scripts/test-alias-hook.mjs --test provenance/check-provenance.test.ts

      - name: Package-script policy unit tests
        run: node --experimental-strip-types --import ./scripts/test-alias-hook.mjs --test src/core/agent/agentExecutionPolicy.test.ts

      - name: Compile Electron main
        run: npm run build:electron

      - name: Real Windows package-script discovery
        run: node --test dist-electron/windowsPackageScript.integration.test.cjs
